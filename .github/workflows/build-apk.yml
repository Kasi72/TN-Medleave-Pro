name: Publish Prebuilt Android APK to Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Direct APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TN-MedLeave-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Direct APK Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "TN MedLeave Pro APK (Release #${{ github.run_number }})"
          body: "Direct Download: Tap **app-debug.apk** under Assets below to download and install on your Android device."
          files: app/build/outputs/apk/debug/app-debug.apk
